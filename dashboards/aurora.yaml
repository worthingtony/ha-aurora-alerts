# Aurora Watch dashboard. Phone first: one column, status on top, Bz chart second.
# Needs apexcharts-card (HACS, RomRider). Everything else is built in.
# Deploy as a storage-mode dashboard (Raw configuration editor), url path `aurora-watch` (HA requires a hyphen).
title: Aurora
views:
  - title: Aurora
    path: aurora
    icon: mdi:aurora
    type: masonry
    cards:
      - type: markdown
        content: >-
          {% set n = now() %}
          {% set u = utcnow() %}
          **{{ u.strftime('%a %d %b') }} - {{ u.strftime('%H:%M') }} UTC**
          &nbsp;|&nbsp; {{ n.strftime('%H:%M %Z') }}
          &nbsp;|&nbsp; {{ states('select.aurora_watch_location') }}

          {% set s = states('sensor.aurora_watch_status') %}
          {% set why = state_attr('sensor.aurora_watch_status', 'reasons') or [] %}
          {% set kind = {'go': 'success', 'elevated': 'warning', 'watch': 'info'} %}
          {% if s in kind %}
          <ha-alert alert-type="{{ kind[s] }}" title="{{ s | upper }}">{{ why | join(' - ') }}</ha-alert>
          {% else %}
          ## {{ s | upper }}
          {{ why | join(' - ') if why else 'Nothing notable.' }}
          {% endif %}
          {% set arr = state_attr('binary_sensor.aurora_watch_loading_incoming', 'arrives') %}
          {% if is_state('binary_sensor.aurora_watch_loading_incoming', 'on') and arr %}
          <ha-alert alert-type="warning" title="GET READY">Loading arrives ~{{ as_timestamp(arr) | timestamp_custom('%H:%M') }}
          ({{ ((as_timestamp(arr) - as_timestamp(n)) / 60) | round(0) | int }} min)</ha-alert>
          {% endif %}

      - type: custom:apexcharts-card
        header:
          show: true
          title: Bz (nT), last 3 h - go needs <= -10 sustained
          show_states: true
          colorize_states: true
        graph_span: 3h
        now:
          show: true
        apex_config:
          chart:
            height: 260
          annotations:
            yaxis:
              - y: -10
                borderColor: "#e53935"
                strokeDashArray: 4
                label:
                  text: "-10 threshold"
                  borderColor: "#e53935"
                  style:
                    color: "#fff"
                    background: "#e53935"
              - y: 0
                borderColor: "#9e9e9e"
        series:
          - entity: sensor.aurora_watch_bz
            name: Bz
            color: "#7e57c2"
            stroke_width: 2
            extend_to: now

      - type: custom:apexcharts-card
        header:
          show: true
          title: GOES Hp (nT), last 6 h - a sharp rise after a dip is onset
          show_states: true
          colorize_states: true
        graph_span: 6h
        apex_config:
          chart:
            height: 200
        series:
          - entity: sensor.aurora_watch_goes_hp
            name: Hp
            color: "#26a69a"
            stroke_width: 2

      - type: custom:apexcharts-card
        header:
          show: true
          title: Solar wind, last 6 h
          show_states: true
          colorize_states: true
        graph_span: 6h
        apex_config:
          chart:
            height: 200
        yaxis:
          - id: speed
            min: 250
          - id: density
            opposite: true
            min: 0
        series:
          - entity: sensor.aurora_watch_solar_wind_speed
            name: Speed (km/s)
            yaxis_id: speed
            color: "#ffa726"
          - entity: sensor.aurora_watch_solar_wind_density
            name: Density (p/cm3)
            yaxis_id: density
            color: "#42a5f5"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.aurora_watch_minutes_south
          - type: tile
            entity: sensor.aurora_watch_bt
          - type: tile
            entity: sensor.aurora_watch_kp_estimated
          - type: tile
            entity: sensor.aurora_watch_g_scale_tonight
          - type: tile
            entity: binary_sensor.aurora_watch_dark_enough
          - type: tile
            entity: weather.forecast_home
            name: Cloud cover
            state_content: cloud_coverage
          - type: tile
            entity: sensor.aurora_watch_data_age
          - type: tile
            entity: sensor.aurora_watch_g_scale_now
      - type: entities
        entities:
          - entity: select.aurora_watch_location
            name: Watching from
          - entity: number.aurora_watch_kp_trigger
            name: Kp needed for go (this spot)
          - entity: binary_sensor.aurora_watch_loading_incoming
            name: Loading incoming
            secondary_info: last-changed
          - entity: sensor.aurora_watch_glendale
            name: Glendale
            secondary_info: last-changed

      - type: markdown
        title: Glendale substorm alerts
        content: >-
          {% set recent = state_attr('sensor.aurora_watch_glendale', 'recent') or [] %}
          {% for g in recent %}
          {% set icon = ['mdi:flash', 'mdi:circle', 'mdi:circle', 'mdi:circle', 'mdi:alert', 'mdi:alert', 'mdi:alert'][g.level] %}
          {% set col = ['#90a4ae', '#fdd835', '#fb8c00', '#e53935', '#d81b60', '#8e24aa', '#6a1b9a'][g.level] %}
          <ha-icon icon="{{ icon }}" style="color: {{ col }}; --mdc-icon-size: 16px"></ha-icon>
          **{{ as_timestamp(g.time) | timestamp_custom('%a %H:%M') }}**
          ({{ as_timestamp(g.time) | timestamp_custom('%H:%M', false) }} UTC) -
          [{{ g.text }}]({{ g.url }})

          {% else %}
          No Glendale posts read yet.
          {% endfor %}
          [Glendale App](https://aurora-alerts.uk/) &nbsp;|&nbsp; [Telegram channel](https://t.me/s/GlendaleApp)

      - type: markdown
        title: NOAA SWPC alerts (24 h)
        content: >-
          {% set a = 'sensor.aurora_watch_swpc_alert' %}
          {% set recent = state_attr(a, 'recent') or [] %}
          {% for x in recent %}
          **{{ as_timestamp(x.time) | timestamp_custom('%a %H:%M') }}**
          ({{ as_timestamp(x.time) | timestamp_custom('%H:%M', false) }} UTC) - {{ x.headline }}

          {% else %}
          No geomagnetic alerts in the last 24 h.
          {% endfor %}
          {% if state_attr(a, 'message') %}
          <details><summary>Latest in full</summary><pre>{{ state_attr(a, 'message')[:1500] }}</pre></details>
          {% endif %}
          [All SWPC alerts, watches and warnings]({{ state_attr(a, 'url') or 'https://www.swpc.noaa.gov/products/alerts-watches-and-warnings' }})
